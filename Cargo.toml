[package]
name = "pica"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
description = "A small terminal text editor in the nano and micro family, with Markdown rendered as you write"
license = "MIT"
repository = "https://github.com/yungibly/pica"
homepage = "https://github.com/yungibly/pica"

[dependencies]
arboard = { version = "3.6", default-features = false }
crossterm = "0.28"
pulldown-cmark = "0.13"
ratatui = "0.29"
tempfile = "3"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
